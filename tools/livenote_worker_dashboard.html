<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/worker-favicon.svg">
  <link rel="shortcut icon" href="/worker-favicon.svg">
  <title>LiveNote · 本地处理中心</title>
  <style>
    :root { color-scheme: dark; --bg:#07131f; --panel:#102431; --panel-2:#132d3a; --line:rgba(201,224,226,.16); --ink:#edf8f5; --muted:#9fb8ba; --accent:#c2f258; --blue:#91c9ff; --amber:#f2c878; --red:#ffab9e; --green:#8ee0bf; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:linear-gradient(180deg,#07131f 0%,#0a1b27 100%); color:var(--ink); font:14px/1.5 "Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; }
    button, select { font:inherit; }
    .shell { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:32px 0 48px; }
    .topbar { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:28px; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:clamp(24px,4vw,36px); letter-spacing:-.04em; }
    .subtitle { margin-top:7px; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    button,.link-button { display:inline-flex; align-items:center; justify-content:center; min-height:36px; border:1px solid rgba(194,242,88,.34); border-radius:7px; background:rgba(194,242,88,.09); color:var(--accent); padding:0 13px; cursor:pointer; text-decoration:none; }
    button:hover,.link-button:hover { background:rgba(194,242,88,.16); }
    button:focus-visible,.link-button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .dashboard-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .panel { border:1px solid var(--line); border-radius:12px; background:rgba(16,36,49,.88); box-shadow:0 12px 36px rgba(0,0,0,.14); }
    .service { padding:18px; min-height:130px; }
    .service-head { display:flex; align-items:center; gap:9px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 4px rgba(159,184,186,.12); }
    .dot.online { background:var(--green); box-shadow:0 0 0 4px rgba(142,224,191,.13); }
    .dot.busy { background:var(--blue); box-shadow:0 0 0 4px rgba(145,201,255,.13); }
    .dot.error { background:var(--red); box-shadow:0 0 0 4px rgba(255,171,158,.13); }
    .dot.online,.dot.busy { animation:status-breathe 1.8s ease-in-out infinite; }
    @keyframes status-breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.18); } }
    @media (prefers-reduced-motion:reduce) { .dot.online,.dot.busy { animation:none; } }
    .service h2 { font-size:18px; }
    .service-state { margin-top:13px; color:var(--accent); font-weight:650; }
    .service-message { margin-top:4px; color:var(--muted); font-size:12px; }
    .service-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .service-actions button { min-height:30px; padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:transparent; color:var(--ink); cursor:pointer; }
    .service-actions button:hover,.service-actions button:focus-visible { border-color:var(--accent); color:var(--accent); }
    .service-actions button:disabled { cursor:wait; opacity:.6; }
    .service-action-status { color:var(--muted); font-size:11px; }
    .section { margin-top:14px; padding:20px; }
    .section-head { display:flex; justify-content:space-between; align-items:baseline; gap:14px; margin-bottom:16px; }
    .section h2 { font-size:20px; }
    .section-note { color:var(--muted); font-size:12px; }
    .current-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .current { min-width:0; border:1px solid var(--line); border-radius:9px; background:rgba(19,45,58,.62); padding:16px; }
    .current h3 { font-size:14px; color:var(--blue); }
    .task-title { overflow:hidden; margin-top:10px; color:var(--ink); font-size:17px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .task-message { margin-top:6px; color:var(--muted); }
    .progress { height:7px; margin-top:14px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.1); }
    .progress span { display:block; height:100%; border-radius:inherit; background:var(--accent); transition:width .25s ease; }
    .progress.indeterminate span { width:35% !important; opacity:.75; }
    .progress-meta { display:flex; justify-content:space-between; gap:10px; margin-top:6px; color:var(--muted); font-size:11px; }
    .empty { color:var(--muted); }
    .event-list { display:grid; gap:0; max-height:390px; overflow:auto; }
    .event { display:grid; grid-template-columns:76px 104px minmax(0,1fr); gap:14px; align-items:start; border-bottom:1px solid rgba(201,224,226,.1); padding:12px 0; }
    .event:last-child { border-bottom:0; }
    .event-meta,.event-source { padding-top:2px; color:var(--muted); font-size:11px; }
    .event-meta { font-variant-numeric:tabular-nums; }
    .event-source { color:var(--accent); }
    .event-content { min-width:0; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr); gap:9px 22px; }
    .event-title-row { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; }
    .event-owner { color:var(--accent); font-weight:700; }
    .event-title { min-width:0; color:var(--ink); font-weight:650; overflow-wrap:anywhere; }
    .event-facts { margin-top:3px; color:var(--muted); font-size:11px; line-height:1.35; overflow-wrap:anywhere; }
    .event-state { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; min-width:0; }
    .event-status { color:var(--muted); font-size:12px; line-height:1.35; }
    .event-status { display:inline-flex; align-items:center; min-height:24px; border:1px solid currentColor; border-radius:999px; padding:2px 8px; font-weight:700; }
    .event-status.active { color:var(--blue); background:rgba(145,201,255,.08); }
    .event-status.done { color:var(--green); background:rgba(142,224,191,.08); }
    .event-status.failed { color:var(--red); background:rgba(255,171,158,.08); }
    .event-details { grid-column:1 / -1; display:grid; grid-template-columns:minmax(0,1fr); gap:8px; min-width:0; }
    .event-detail { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:8px; min-width:0; color:var(--muted); font-size:12px; line-height:1.4; }
    .event-detail-label { color:var(--blue); font-weight:650; }
    .event-detail-value { min-width:0; overflow-wrap:anywhere; }
    .log-box { margin-top:16px; }
    .log-box summary { cursor:pointer; color:var(--muted); }
    pre { max-height:230px; overflow:auto; margin:10px 0 0; border:1px solid var(--line); border-radius:8px; background:#081722; padding:12px; color:#c6dad8; font:12px/1.55 Consolas,"Courier New",monospace; white-space:pre-wrap; }
    .footer-note { margin-top:18px; color:var(--muted); font-size:12px; }
    @media (max-width:920px) { .dashboard-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .event { grid-template-columns:68px 92px minmax(0,1fr); gap:10px; } .event-content { grid-template-columns:1fr; gap:8px; } .event-details { gap:6px; } }
    @media (max-width:760px) { .shell { width:min(100% - 22px,620px); padding-top:22px; } .topbar { display:block; } .actions { justify-content:flex-start; margin-top:16px; } .dashboard-grid,.current-grid { grid-template-columns:1fr; } .section { padding:15px; } .event { grid-template-columns:1fr; gap:5px; padding:13px 0; } .event-meta,.event-source { padding-top:0; } .event-state { margin-top:2px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><h1>本地处理中心</h1><p class="subtitle">LiveNote · 这台电脑正在负责下载、识别和生成总结</p></div>
      <div class="actions"><button id="refresh" type="button">立即刷新</button><a class="link-button" href="https://livenote.yolotech.top/?mode=control" target="_blank" rel="noreferrer">打开云端管理台</a></div>
    </header>
    <section class="dashboard-grid" aria-label="服务状态">
      <article class="panel service" id="worker-card"><div class="service-head"><span class="dot"></span><h2>本地 Worker</h2></div><p class="service-state">读取中…</p><p class="service-message"></p><div class="service-actions"><button id="restart-worker" type="button">重启 Worker</button><span id="restart-worker-status" class="service-action-status" role="status" aria-live="polite"></span></div></article>
      <article class="panel service" id="codex-card"><div class="service-head"><span class="dot"></span><h2>本地总结</h2></div><p class="service-state">读取中…</p><p class="service-message"></p></article>
      <article class="panel service" id="localServer-card"><div class="service-head"><span class="dot"></span><h2>本地 Server</h2></div><p class="service-state">读取中…</p><p class="service-message"></p><div class="service-actions"><button id="start-local-server" type="button">启动本地 Server</button><span id="start-local-server-status" class="service-action-status" role="status" aria-live="polite"></span></div></article>
      <article class="panel service" id="server-card"><div class="service-head"><span class="dot"></span><h2>ECS 连接</h2></div><p class="service-state">读取中…</p><p class="service-message"></p></article>
    </section>
    <section class="panel section" id="current-progress" hidden><div class="section-head"><h2>当前进度</h2><span class="section-note" id="updated">正在连接…</span></div><div class="current-grid"><article class="current" id="worker-current" hidden><h3>本地 Worker</h3><p class="empty">暂无正在处理的录音</p></article><article class="current" id="codex-current" hidden><h3>本地总结</h3><p class="empty">暂无正在生成的总结</p></article></div></section>
    <section class="panel section"><div class="section-head"><h2>最近动态</h2><span class="section-note">每个任务一条 · 信息按重要性分层</span></div><div class="event-list" id="events"><p class="empty">暂时没有动态。</p></div><details class="log-box"><summary>查看后台日志</summary><pre id="logs">选择日志后加载。</pre><select id="log-name" aria-label="选择日志"><option value="storage-worker.stdout.log">Worker 正常日志</option><option value="storage-worker.stderr.log">Worker 错误日志</option><option value="codex-bridge.stdout.log">总结正常日志</option><option value="codex-bridge.stderr.log">总结错误日志</option></select></details></section>
    <p class="footer-note">这个页面只在本机打开，关闭页面不会停止处理。任务完成后，请到云端管理台审核并发布。</p>
  </main>
  <script>
    const phaseLabels = { starting:'启动中', checking:'检查任务', claiming:'领取任务', downloading:'下载录音', ready:'已准备', reconstructing:'拼接录音', transcribing:'正在识别', uploading:'回传结果', summarizing:'正在生成总结', completed:'已完成', waiting:'等待任务', failed:'处理失败', orphaned:'任务已失效', stopped:'已停止' }
    const serviceLabels = { worker:'本地 Worker', codex:'本地总结', localServer:'本地 Server', server:'ECS 连接' }
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))
    const timeLabel = (value) => value ? new Date(value).toLocaleTimeString('zh-CN') : '—'
    const dateTimeLabel = (value) => value ? new Date(value).toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '日期未知'
    const durationLabel = (value) => { const totalSeconds = Math.max(0, Math.round(Number(value || 0) / 1000)); if (!totalSeconds) return '时长未知'; const hours = Math.floor(totalSeconds / 3600); const minutes = Math.floor((totalSeconds % 3600) / 60); const seconds = totalSeconds % 60; return hours ? `${hours}小时${String(minutes).padStart(2, '0')}分` : `${minutes}分${String(seconds).padStart(2, '0')}秒` }
    const phaseLabel = (value) => phaseLabels[value] || value || '未知'
    const statusClass = (item) => item.online ? (['failed','orphaned'].includes(item.phase) ? 'error' : (['transcribing','summarizing','downloading','reconstructing','uploading','claiming'].includes(item.phase) ? 'busy' : 'online')) : (['failed','orphaned'].includes(item.phase) ? 'error' : '')
    function sourceSummary(item) { return Array.isArray(item.sources) ? item.sources.map((source) => `${source.label}：${source.online ? '运行中' : '未连接'}`).join(' · ') : '' }
    function renderService(id, item) { const card = document.getElementById(id + '-card'); const dot = card.querySelector('.dot'); dot.className = 'dot ' + statusClass(item); const isServer = ['localServer','server'].includes(id); card.querySelector('.service-state').textContent = isServer ? (item.online ? '运行正常' : '未运行') : (item.online ? phaseLabel(item.phase) : (item.phase === 'failed' ? '处理失败' : '未运行')); card.querySelector('.service-message').textContent = [item.message || '', sourceSummary(item)].filter(Boolean).join(' · ') || '—' }
    function renderService(id, item) { const card = document.getElementById(id + '-card'); const dot = card.querySelector('.dot'); dot.className = 'dot ' + statusClass(item); const isServer = ['localServer','server'].includes(id); card.querySelector('.service-state').textContent = isServer ? (item.online ? '运行正常' : '未运行') : (item.online ? phaseLabel(item.phase) : (item.phase === 'failed' ? '处理失败' : '未运行')); card.querySelector('.service-message').textContent = [item.message || '', sourceSummary(item)].filter(Boolean).join(' · ') || '—'; if (id === 'localServer') { const button = document.getElementById('start-local-server'); button.disabled = Boolean(item.online); button.textContent = item.online ? '本地 Server 已运行' : '启动本地 Server' } }
    function renderCurrent(id, item) { const root = document.getElementById(id + '-current'); const task = item.task; const source = item.sourceLabel ? ` · ${item.sourceLabel}` : ''; if (!task) { root.hidden = true; root.innerHTML = ''; return false } root.hidden = false; const hasProgress = item.progress && (item.progress.total || item.progress.indeterminate); const total = Number(item.progress && item.progress.total || 0); const current = Number(item.progress && item.progress.current || 0); const progress = hasProgress && total > 0 && !item.progress.indeterminate ? Math.min(100, Math.round(current / total * 100)) : null; const progressClass = item.progress && item.progress.indeterminate ? ' indeterminate' : ''; const progressLeft = progress === null ? '正在准备…' : `${esc(current)} / ${esc(total)} ${esc(item.progress.unit || '')}`; const progressRight = [item.progress && item.progress.device ? `设备：${item.progress.device}` : '', item.progress && item.progress.elapsedSeconds != null ? `已运行 ${Number(item.progress.elapsedSeconds).toFixed(0)} 秒` : '', progress === null ? '' : `${progress}%`].filter(Boolean).join(' · '); root.innerHTML = `<h3>${serviceLabels[id]}${source} · ${esc(phaseLabel(item.phase))}</h3><p class="task-title" title="${esc(task.title)}">${esc(task.title)}</p><p class="task-message">${esc(item.message || '')}</p>${hasProgress ? `<div class="progress${progressClass}" role="progressbar" aria-valuenow="${progress === null ? 0 : progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${progress === null ? 35 : progress}%"></span></div><div class="progress-meta"><span>${progressLeft}</span><span>${esc(progressRight)}</span></div>` : ''}`; return true }
    const taskStatusLabels = { READY:'排队中', CLAIMED:'已领取', LOCAL_READY:'已就绪', PROCESSING:'处理中', TRANSCRIBING:'正在识别', TRANSCRIBED:'已识别，待总结', SUMMARIZING:'正在生成总结', REVIEW:'待发布', READY_TO_UPLOAD:'待回传', COMPLETED:'已完成', FAILED:'失败' }
    const taskStatusLabel = (value, fallback) => taskStatusLabels[value] || value || fallback || '未知'
    function renderEvents(events) {
      const root = document.getElementById('events')
      const rawTaskEvents = (events || []).filter((event) => event && (event.taskId || event.task?.id || event.task?.taskId))
      if (!rawTaskEvents.length) { root.innerHTML = '<p class="empty">暂时没有已处理的任务。</p>'; return }
      const taskEvents = rawTaskEvents.some((event) => Array.isArray(event.history)) ? rawTaskEvents : Array.from(rawTaskEvents.slice().reverse().reduce((groups, event) => {
        const task = event.task && typeof event.task === 'object' ? event.task : {}
        const taskId = event.taskId || task.id || task.taskId
        const current = groups.get(taskId) || { ...event, task, taskId, history: [] }
        const previous = current.history[current.history.length - 1]
        const historyItem = { ...event, service: event.service || current.service, phase: event.phase || current.phase }
        if (!previous || previous.service !== historyItem.service || previous.phase !== historyItem.phase) current.history.push(historyItem)
        else current.history[current.history.length - 1] = historyItem
        current.task = { ...(current.task || {}), ...task }
        Object.assign(current, event, { task: current.task, taskId, history: current.history })
        groups.set(taskId, current)
        return groups
      }, new Map()).values()).sort((left, right) => (right.updatedAt || 0) - (left.updatedAt || 0))
      root.innerHTML = taskEvents.map((event) => {
        const task = event.task && typeof event.task === 'object' ? event.task : {}
        const taskId = event.taskId || task.id || task.taskId
        const title = event.title || task.title || task.sessionTitle || taskId || '未知任务'
        const owner = event.ownerName || task.ownerName || event.ownerId || task.ownerId || '未标注用户'
        const taskStatus = event.taskStatus || event.status || task.status || (event.phase === 'completed' ? 'COMPLETED' : event.phase === 'failed' ? 'FAILED' : '')
        const duration = event.durationMs ?? task.durationMs
        const started = event.startedAt ?? task.startedAt
        const terminal = ['COMPLETED', 'REVIEW', 'FAILED'].includes(taskStatus) || ['completed', 'failed', 'orphaned'].includes(event.phase)
        const result = event.result || (event.error ? `失败：${event.error}` : terminal ? (taskStatus === 'FAILED' || event.phase === 'failed' ? '处理失败' : '已生成结果') : '尚未产生结果')
        const statusTone = taskStatus === 'FAILED' || event.phase === 'failed' || event.phase === 'orphaned' ? 'failed' : (['COMPLETED', 'REVIEW'].includes(taskStatus) || event.phase === 'completed' ? 'done' : 'active')
        const recordedAt = dateTimeLabel(started || task.createdAt || event.createdAt || event.updatedAt)
        const identity = `用户：${owner} · 任务：${title} · 录音：${recordedAt} · 时长：${durationLabel(duration)}`
        const sourceLabel = [event.sourceLabel, serviceLabels[event.service] || event.service || '后台任务'].filter(Boolean).join(' · ')
        return `<div class="event"><span class="event-meta">${esc(timeLabel(event.updatedAt))}</span><span class="event-source">${esc(sourceLabel)}</span><div class="event-content"><div><div class="event-title-row"><span class="event-owner">用户：${esc(owner)}</span><span class="event-title" title="${esc(identity)}">${esc(title)}</span></div><div class="event-facts">录音：${esc(recordedAt)} · 时长：${esc(durationLabel(duration))} · 任务：${esc(taskId)}</div></div><div class="event-state"><span class="event-status ${statusTone}">状态：${esc(taskStatusLabel(taskStatus, phaseLabel(event.phase)))}</span></div><div class="event-details"><div class="event-detail"><span class="event-detail-label">结果</span><span class="event-detail-value" title="${esc(result)}">${esc(result)}</span></div></div></div></div>`
      }).join('')
    }
    async function loadLogs() { const name = document.getElementById('log-name').value; const response = await fetch('/api/logs?name=' + encodeURIComponent(name) + '&t=' + Date.now()); const data = await response.json(); document.getElementById('logs').textContent = data.lines.join('\n') || '暂无日志。' }
    async function refresh() { try { const response = await fetch('/api/status?t=' + Date.now()); const data = await response.json(); renderService('worker', data.worker); renderService('codex', data.codex); renderService('localServer', data.localServer); renderService('server', data.server); const hasWorkerTask = renderCurrent('worker', data.worker); const hasCodexTask = renderCurrent('codex', data.codex); document.getElementById('current-progress').hidden = !(hasWorkerTask || hasCodexTask); document.getElementById('updated').textContent = '更新于 ' + timeLabel(data.updatedAt); renderEvents(data.events || []) } catch (error) { document.getElementById('updated').textContent = '页面服务连接失败'; console.error(error) } }
    async function restartWorker() { const button = document.getElementById('restart-worker'); const status = document.getElementById('restart-worker-status'); button.disabled = true; status.textContent = '正在重启…'; try { const response = await fetch('/api/worker/restart', { method:'POST' }); const data = await response.json(); status.textContent = data.message || (response.ok ? '重启已开始。' : '重启失败。'); if (response.ok) { setTimeout(refresh, 1000); setTimeout(() => { status.textContent = ''; button.disabled = false }, 5000) } else { button.disabled = false } } catch (error) { status.textContent = '页面服务连接失败。'; button.disabled = false } }
    async function startLocalServer() { const button = document.getElementById('start-local-server'); const status = document.getElementById('start-local-server-status'); const dot = document.querySelector('#localServer-card .dot'); button.disabled = true; status.textContent = ''; dot.className = 'dot busy'; try { const response = await fetch('/api/local-server/start', { method:'POST' }); const data = await response.json(); if (!response.ok) { status.textContent = data.message || '启动失败。'; dot.className = 'dot error'; button.disabled = false } else { setTimeout(refresh, 1000) } } catch (error) { status.textContent = '页面服务连接失败。'; dot.className = 'dot error'; button.disabled = false } }
    document.getElementById('restart-worker').addEventListener('click', restartWorker)
    document.getElementById('start-local-server').addEventListener('click', startLocalServer)
    document.getElementById('refresh').addEventListener('click', refresh); document.getElementById('log-name').addEventListener('change', loadLogs); refresh(); setInterval(refresh, 10000)
  </script>
</body>
</html>
